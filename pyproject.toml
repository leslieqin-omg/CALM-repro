[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calm-repro"
version = "1.0.0"
description = "Reproduction of CALM (Cross-attention Adaptive Immune Receptor-Antigen Language Model), Lee et al. 2026"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "biopython>=1.81",
    "transformers>=4.40,<5",
    "fair-esm==2.0.0",
    "antiberty==0.1.3",
]

[project.optional-dependencies]
preprocess = ["abnumber>=0.3.2", "parasail>=1.3.4"]

[project.scripts]
calm = "calm.cli:main"

[tool.setuptools.packages.find]
include = ["calm*"]
